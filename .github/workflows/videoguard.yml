name: VideoGuard multimodal verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  videoguard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded local media adapter dependency
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - run: python -m pip install -r projects/video-guard/requirements.txt
      - name: Gradients, protocol, frozen evidence, JS parity
        working-directory: projects/video-guard
        run: python -m unittest discover -s tests -v
      - name: Rebuild standalone demo
        working-directory: projects/video-guard
        run: python localize_demo.py
      - name: Causal detector alarm-time parity
        working-directory: projects/video-guard
        run: python check_drift_js.py
      - name: Set-valued inference and risk JS parity
        working-directory: projects/video-guard
        run: python check_depth_js.py
      - name: Local-only media adapter smoke
        working-directory: projects/video-guard
        run: python media_smoke.py
