name: Local reliability lab checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Structural checks
        run: |
          python scripts/build_work_experience.py
          python scripts/build_resume_portfolio.py
          python scripts/check_portfolio.py
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen real LLM evidence without downloading models
        working-directory: projects/cite-rag
        run: python -m memory_agent.verify
      - name: Laminar-related gradient and version contracts
        run: python -m unittest discover -s tests -p test_laminar_lab.py -v
      - name: Smoke run
        working-directory: projects/reliability-lab
        run: python -m reliability_lab run --count 4 --profile clean
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ml.txt
      - name: Verify frozen models and protocol
        run: python -m unittest discover -s tests -p test_ai_projects.py -v
      - name: Build deterministic demos
        run: python scripts/build_ai_demos.py
      - name: JS and Python inference parity
        run: python scripts/check_demo_inference.py
      - name: Cross-disciplinary numerical protocols
        run: python -m unittest discover -s tests -p test_cross_projects.py -v
      - name: Cross-disciplinary frozen demos
        run: python scripts/build_cross_demos.py
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ml.txt
      - name: Algorithm and export verification
        run: python -m unittest discover -s tests -p test_frontier_projects.py -v
      - name: Build frozen demos
        run: python scripts/build_frontier_demos.py
  depth:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-depth.txt
      - name: Laminar gradient, version and recovery contracts
        run: python -m unittest discover -s tests -p test_laminar_lab.py -v
      - name: Depth numerical, cache, capacity and API verification
        run: python -m unittest discover -s tests -p test_depth_projects.py -v
      - name: Build self-contained depth inspectors
        run: python scripts/build_depth_demos.py
      - name: Build academic project pages
        run: python scripts/build_project_pages.py
      - name: Project-specific investigation verification
        run: python -m unittest discover -s tests -p test_investigations.py -v
      - name: Build deep investigation pages
        run: python scripts/build_investigation_pages.py
      - name: Verify presentation and frozen evidence
        run: python -m unittest discover -s tests -p test_presentation.py -v
