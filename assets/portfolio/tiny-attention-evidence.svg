anchor="middle">0.140</text><rect x="587.46" y="307.40" width="52.08" height="27.60" rx="2" fill="#de9560"/><text x="613.5" y="299.4" font-size="16" class="heading" text-anchor="middle">0.120</text><text x="582.5" y="360" font-size="18" class="note" text-anchor="middle">No-attn</text><rect x="28" y="382" width="15" height="15" fill="#214e85"/><text x="51" y="395" font-size="16" class="note" text-anchor="start">3 pairs</text><rect x="258" y="382" width="15" height="15" fill="#de9560"/><text x="281" y="395" font-size="16" class="note" text-anchor="start">5 pairs OOD</text><text x="28" y="429" font-size="16" class="note" text-anchor="start">Longer inputs degrade performance; failures are retained.</text><text x="28" y="455" font-size="15" class="note" text-anchor="start">10226 trainable parameters; not language pretraining.</text></svg>