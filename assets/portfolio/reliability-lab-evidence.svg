<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>FlowBench: crash recovery</title><desc>Duplicate side effects · controlled crash. Lower is better. Source: frozen local experiment report.</desc><rect width="800" height="480" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif}.heading{fill:#13386c;font-weight:bold}.note{fill:#59697b}</style><text x="28" y="35" font-size="26" class="heading" text-anchor="start">FlowBench: crash recovery</text><text x="28" y="63" font-size="17" class="note" text-anchor="start">Duplicate side effects · controlled crash</text><text x="772" y="63" font-size="14" class="note" text-anchor="end">Lower is better</text><line x1="65" x2="755" y1="335.0" y2="335.0" stroke="#e7ecf2"/><text x="56" y="340.0" font-size="14" class="note" text-anchor="end">0.00</text><line x1="65" x2="755" y1="277.5" y2="277.5" stroke="#e7ecf2"/><text x="56" y="282.5" font-size="14" class="note" text-anchor="end">0.25</text><line x1="65" x2="755" y1="220.0" y2="220.0" stroke="#e7ecf2"/><text x="56" y="225.0" font-size="14" class="note" text-anchor="end">0.50</text><line x1="65" x2="755" y1="162.5" y2="162.5" stroke="#e7ecf2"/><text x="56" y="167.5" font-size="14" class="note" text-anchor="end">0.75</text><line x1="65" x2="755" y1="105.0" y2="105.0" stroke="#e7ecf2"/><text x="56" y="110.0" font-size="14" class="note" text-anchor="end">1.00</text><rect x="211.46" y="105.00" width="52.08" height="230.00" rx="2" fill="#214e85"/><text x="237.5" y="97.0" font-size="16" class="heading" text-anchor="middle">1.000</text><text x="237.5" y="360" font-size="18" class="note" text-anchor="middle">Retry</text><rect x="556.46" y="335.00" width="52.08" height="1.50" rx="2" fill="#214e85"/><text x="582.5" y="327.0" font-size="16" class="heading" text-anchor="middle">0.000</text><text x="582.5" y="360" font-size="18" class="note" text-anchor="middle">Resilient</text><rect x="28" y="382" width="15" height="15" fill="#214e85"/><text x="51" y="395" font-size="16" class="note" text-anchor="start">After commit</text><text x="28" y="429" font-size="16" class="note" text-anchor="start">Both recover 4 tasks; idempotence removes duplicated effects.</text><text x="28" y="455" font-size="15" class="note" text-anchor="start">Only experiment subprocesses; not power-loss resilience.</text></svg>